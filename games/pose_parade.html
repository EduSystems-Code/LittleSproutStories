<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pose Parade — LittleSprout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--sprout:#5BA672;--sprout-dark:#3C7A52;--sprout-deep:#2C5C3D;--cream:#FBF6EC;--cream-deep:#F3EAD6;
--paper-line:#E7DCC4;--sky:#BFE3FA;--sky-deep:#185FA5;--sun:#FFD24A;--sun-deep:#E1A400;--berry:#B0488C;
--bark:#36402C;--bark-soft:#5E6650;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--bark);min-height:100vh;
 display:flex;flex-direction:column;align-items:center;padding:18px;line-height:1.5}
h1,h2,h3,button{font-family:'Fredoka',sans-serif;font-weight:600}
.topbar{width:100%;max-width:860px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.back{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;color:var(--sprout-dark);
 background:#fff;border:2px solid var(--paper-line);border-radius:50px;padding:9px 18px;text-decoration:none}
.back:hover{border-color:var(--sprout)}
.stars{font-size:22px;letter-spacing:2px;min-height:28px}
.title{text-align:center;margin-bottom:6px;font-size:clamp(26px,5vw,38px);color:var(--bark)}
.sub{text-align:center;color:var(--bark-soft);font-weight:700;margin-bottom:22px;font-size:16px}
.panel{background:#fff;border:1px solid var(--paper-line);border-radius:26px;padding:26px;
 box-shadow:0 8px 26px rgba(54,64,44,.08);width:100%;max-width:860px}
.btn{background:var(--sun);color:#5A4200;border:none;border-radius:50px;padding:14px 30px;font-size:18px;
 box-shadow:0 5px 0 var(--sun-deep);cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--sun-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun-deep)}
.btn.green{background:var(--sprout);color:#fff;box-shadow:0 5px 0 var(--sprout-dark)}
.btn.green:hover{box-shadow:0 7px 0 var(--sprout-dark)}
.center{text-align:center}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
:focus-visible{outline:3px solid var(--sky-deep);outline-offset:3px;border-radius:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.pick{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.pick button{background:#fff;border:3px solid var(--paper-line);border-radius:22px;padding:12px;cursor:pointer;
 width:132px;transition:border-color .15s,transform .15s}
.pick button:hover{border-color:var(--sprout);transform:translateY(-4px)}
.pick img{width:100%;height:120px;object-fit:contain}
.pick span{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;margin-top:6px;color:var(--bark)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:6px}
@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:10px}}
.card{aspect-ratio:3/4;border:none;border-radius:20px;cursor:pointer;position:relative;
 background:var(--sky);perspective:800px;padding:0}
.inner{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.card.flip .inner,.card.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;
 align-items:center;justify-content:center;overflow:hidden}
.back{background:linear-gradient(160deg,var(--sky),#9BD0F0);font-size:40px}
.front{background:#fff;border:3px solid var(--sprout);transform:rotateY(180deg);flex-direction:column;padding:6px}
.front img{width:100%;height:72%;object-fit:contain}
.front b{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;color:var(--sprout-deep)}
.card.done{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.08)}}
.win{text-align:center;padding:20px 0}
.win img{height:190px}
.win h2{font-size:32px;color:var(--sprout-deep);margin:10px 0 6px}
body.easyread{letter-spacing:.03em;word-spacing:.1em}body.easyread .hint,body.easyread .sub{line-height:1.9}.topbar-right{display:flex;align-items:center;gap:10px}.aa{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;color:var(--sprout-dark);background:#fff;border:2px solid var(--paper-line);border-radius:50px;padding:8px 16px;cursor:pointer}.aa[aria-pressed="true"]{background:var(--sprout);color:#fff;border-color:var(--sprout)}.btn,.tile,.aa,.back{transition:transform .12s ease}.btn:active,.tile:not(:disabled):active,.aa:active,.back:active{transform:scale(.93)}.confetti-piece{position:fixed;top:-12px;width:10px;height:14px;opacity:.95;pointer-events:none;z-index:999;animation:confettiFall linear forwards}@keyframes confettiFall{to{transform:translateY(110vh) rotate(560deg);opacity:.6}}@media(prefers-reduced-motion:reduce){.btn:active,.tile:active,.aa:active,.back:active{transform:none}.confetti-piece{display:none}}</style></head><body>
<div class="topbar"><a class="back" href="../index.html">&#8592; Back</a><div class="topbar-right"><button type="button" class="aa" id="easyBtn" onclick="toggleEasy()" aria-pressed="false" title="Easier-to-read spacing">Aa</button><button type="button" class="aa" id="muteBtn" onclick="toggleMute()" aria-pressed="false" title="Sound on/off">🔊</button><div class="stars" id="stars"></div></div></div>
<h1 class="title">Pose Parade</h1>
<p class="sub">Find the two friends doing the same thing.</p>
<div class="panel" id="panel"></div>
<script>
const SPRITES = {"maya_waving": "../assets/sprites/maya_happy_waving.png", "maya_jumping": "../assets/sprites/maya_happy_jumping.png", "maya_sitting": "../assets/sprites/maya_happy_sitting.png", "maya_pointing": "../assets/sprites/maya_happy_pointing.png", "maya_kneeling": "../assets/sprites/maya_happy_kneeling.png", "maya_running": "../assets/sprites/maya_happy_running.png", "marcus_waving": "../assets/sprites/marcus_happy_waving.png", "marcus_jumping": "../assets/sprites/marcus_happy_jumping.png", "marcus_sitting": "../assets/sprites/marcus_happy_sitting.png", "marcus_pointing": "../assets/sprites/marcus_happy_pointing.png", "marcus_kneeling": "../assets/sprites/marcus_happy_kneeling.png", "marcus_running": "../assets/sprites/marcus_happy_running.png", "sophie_waving": "../assets/sprites/sophie_happy_waving.png", "sophie_jumping": "../assets/sprites/sophie_happy_jumping.png", "sophie_sitting": "../assets/sprites/sophie_happy_sitting.png", "sophie_pointing": "../assets/sprites/sophie_happy_pointing.png", "sophie_kneeling": "../assets/sprites/sophie_happy_kneeling.png", "sophie_running": "../assets/sprites/sophie_happy_running.png", "james_waving": "../assets/sprites/james_happy_waving.png", "james_jumping": "../assets/sprites/james_happy_jumping.png", "james_sitting": "../assets/sprites/james_happy_sitting.png", "james_pointing": "../assets/sprites/james_happy_pointing.png", "james_kneeling": "../assets/sprites/james_happy_kneeling.png", "james_running": "../assets/sprites/james_happy_running.png"};
const POSES = ["waving", "jumping", "sitting", "pointing", "kneeling", "running"];
const WORDS = {waving:"waving",jumping:"jumping",sitting:"sitting",pointing:"pointing",kneeling:"kneeling",running:"running"};
const CHARS = [["maya","Maya"],["marcus","Marcus"],["sophie","Sophie"],["james","James"]];
const panel = document.getElementById('panel');
const starEl = document.getElementById('stars');
let char='maya', cards=[], open=[], matched=0, stars=0, lock=false;

function say(t){ try{ const u=new SpeechSynthesisUtterance(t); u.rate=.85; u.pitch=1.15; speechSynthesis.speak(u);}catch(e){} }
function drawStars(){ starEl.textContent = "\u2b50".repeat(stars); }

function chooser(){
  panel.innerHTML = '<h3 class="center" style="font-size:22px;margin-bottom:16px">Pick a friend to play with</h3><div class="pick" id="pick"></div>';
  const p = document.getElementById('pick');
  CHARS.forEach(([id,name])=>{
    const b=document.createElement('button');
    b.innerHTML='<img alt="'+name+'" src="'+SPRITES[id+'_waving']+'"><span>'+name+'</span>';
    b.onclick=()=>{char=id; say("Let's play with "+name); start();};
    p.appendChild(b);
  });
}

function start(){
  matched=0; open=[]; lock=false;
  cards = POSES.concat(POSES).map((p,i)=>({pose:p,id:i}));
  for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}
  panel.innerHTML='<div class="grid" id="grid"></div>';
  const g=document.getElementById('grid');
  cards.forEach(c=>{
    const b=document.createElement('button');
    b.className='card'; b.setAttribute('aria-label','Hidden card');
    b.innerHTML='<div class="inner"><div class="face back">\u2753</div><div class="face front">'+
      '<img alt="" src="'+SPRITES[char+'_'+c.pose]+'"><b>'+WORDS[c.pose]+'</b></div></div>';
    b.onclick=()=>flip(b,c);
    g.appendChild(b);
  });
}

function flip(el,c){
  if(lock||el.classList.contains('flip')||el.classList.contains('done'))return;
  sfxPop();
  el.classList.add('flip'); open.push({el,c});
  if(open.length===2){
    lock=true;
    const [a,b]=open;
    if(a.c.pose===b.c.pose){
      setTimeout(()=>{
        a.el.classList.add('done'); b.el.classList.add('done');
        a.el.classList.remove('flip'); b.el.classList.remove('flip');
        say(WORDS[a.c.pose]); matched++; stars=Math.min(6,matched); drawStars(); saveGameStars(stars); sfxSuccess();
        open=[]; lock=false;
        if(matched===POSES.length) setTimeout(win,700);
      },520);
    } else {
      sfxOops(); setTimeout(()=>{a.el.classList.remove('flip');b.el.classList.remove('flip');open=[];lock=false;},900);
    }
  }
}

function win(){
  sfxCheer(); confettiBurst();
  panel.innerHTML='<div class="win"><img alt="" src="'+SPRITES[char+'_jumping']+'">'+
    '<h2>You found them all!</h2><p class="sub">Six poses matched.</p>'+
    '<div class="row"><button class="btn" id="again">Play again</button>'+
    '<button class="btn green" id="switch">Pick a new friend</button></div></div>';
  say("You found them all!");
  document.getElementById('again').onclick=()=>{stars=0;drawStars();start();};
  document.getElementById('switch').onclick=()=>{stars=0;drawStars();chooser();};
}
drawStars(); chooser();

function loadProgress(){try{return JSON.parse(localStorage.getItem('littlesprout')||'{}');}catch(e){return{};}}
function saveProgress(d){try{localStorage.setItem('littlesprout',JSON.stringify(d));return true;}catch(e){return false;}}
function toggleEasy(){const on=document.body.classList.toggle('easyread');document.getElementById('easyBtn').setAttribute('aria-pressed',on?'true':'false');const d=loadProgress();d.easyread=on;saveProgress(d);}
(function initEasy(){if(loadProgress().easyread){document.body.classList.add('easyread');const b=document.getElementById('easyBtn');if(b)b.setAttribute('aria-pressed','true');}})();
function saveGameStars(n){const d=loadProgress();d.games=d.games||{};const prev=(d.games['pose_parade']&&d.games['pose_parade'].stars)||0;d.games['pose_parade']={stars:Math.max(prev,n),at:Date.now()};saveProgress(d);}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('../sw.js').catch(function(){});});}

let audioCtx=null;
function getAudioCtx(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return audioCtx;}
function isMuted(){return !!loadProgress().muted;}
function tone(freq,dur,type,vol){if(isMuted())return;const ctx=getAudioCtx();if(!ctx)return;try{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.value=freq;o.connect(g);g.connect(ctx.destination);g.gain.value=vol||0.1;g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);o.start();o.stop(ctx.currentTime+dur);}catch(e){}}
function sfxPop(){tone(520,.12,'sine',.12);}
function sfxSuccess(){tone(523,.12,'sine',.1);setTimeout(function(){tone(659,.12,'sine',.1);},90);setTimeout(function(){tone(784,.2,'sine',.12);},180);}
function sfxOops(){tone(220,.18,'sine',.08);}
function sfxCheer(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,.18,'sine',.1);},i*100);});}
function confettiBurst(){
 if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const colors=['#5BA672','#FFD24A','#185FA5','#B0488C','#E8433F'];
 for(let i=0;i<24;i++){const p=document.createElement('div');p.className='confetti-piece';p.style.left=(Math.random()*100)+'vw';p.style.background=colors[i%colors.length];p.style.animationDuration=(1.4+Math.random()*1.2)+'s';p.style.transform='rotate('+(Math.random()*360)+'deg)';document.body.appendChild(p);setTimeout(function(){p.remove();},3000);}
}
function toggleMute(){const d=loadProgress();d.muted=!d.muted;saveProgress(d);const b=document.getElementById('muteBtn');b.textContent=d.muted?'🔇':'🔊';b.setAttribute('aria-pressed',d.muted?'true':'false');}
(function initMute(){if(loadProgress().muted){const b=document.getElementById('muteBtn');if(b){b.textContent='🔇';b.setAttribute('aria-pressed','true');}}})();
</script></body></html>
