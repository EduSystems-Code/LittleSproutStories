<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who's Missing? — LittleSprout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--sprout:#5BA672;--sprout-dark:#3C7A52;--sprout-deep:#2C5C3D;--cream:#FBF6EC;--cream-deep:#F3EAD6;
--paper-line:#E7DCC4;--sky:#BFE3FA;--sky-deep:#185FA5;--sun:#FFD24A;--sun-deep:#E1A400;--berry:#B0488C;
--bark:#36402C;--bark-soft:#5E6650;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--bark);min-height:100vh;
 display:flex;flex-direction:column;align-items:center;padding:18px;line-height:1.5}
h1,h2,h3,button{font-family:'Fredoka',sans-serif;font-weight:600}
.topbar{width:100%;max-width:860px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.back{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;color:var(--sprout-dark);
 background:#fff;border:2px solid var(--paper-line);border-radius:50px;padding:9px 18px;text-decoration:none}
.back:hover{border-color:var(--sprout)}
.stars{font-size:22px;letter-spacing:2px;min-height:28px}
.title{text-align:center;margin-bottom:6px;font-size:clamp(26px,5vw,38px);color:var(--bark)}
.sub{text-align:center;color:var(--bark-soft);font-weight:700;margin-bottom:22px;font-size:16px}
.panel{background:#fff;border:1px solid var(--paper-line);border-radius:26px;padding:26px;
 box-shadow:0 8px 26px rgba(54,64,44,.08);width:100%;max-width:860px}
.btn{background:var(--sun);color:#5A4200;border:none;border-radius:50px;padding:14px 30px;font-size:18px;
 box-shadow:0 5px 0 var(--sun-deep);cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--sun-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun-deep)}
.btn.green{background:var(--sprout);color:#fff;box-shadow:0 5px 0 var(--sprout-dark)}
.btn.green:hover{box-shadow:0 7px 0 var(--sprout-dark)}
.center{text-align:center}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
:focus-visible{outline:3px solid var(--sky-deep);outline-offset:3px;border-radius:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.stage{display:flex;justify-content:center;align-items:flex-end;gap:10px;min-height:250px;flex-wrap:wrap}
.friend{width:150px;text-align:center;transition:opacity .35s,transform .35s}
.friend img{width:100%;height:210px;object-fit:contain}
.friend b{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;color:var(--sprout-deep)}
.friend.gone{opacity:0;transform:translateY(14px) scale(.9)}
.curtain{background:linear-gradient(160deg,var(--berry),#8A3068);border-radius:22px;min-height:250px;
 display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fredoka',sans-serif;
 font-size:26px;font-weight:600}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
@media(max-width:600px){.answers{grid-template-columns:repeat(2,1fr)}}
.ans{background:#fff;border:3px solid var(--paper-line);border-radius:18px;padding:16px 8px;
 font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px;color:var(--bark);cursor:pointer;transition:.15s}
.ans:hover{border-color:var(--sprout);transform:translateY(-3px)}
.ans.right{background:#E8F4DC;border-color:var(--sprout);color:var(--sprout-deep)}
.ans.wrong{background:#FCE0EE;border-color:var(--berry);opacity:.65}
.msg{text-align:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;
 color:var(--sprout-deep);min-height:34px;margin-top:16px}
</style></head><body>

const CHARS = [["maya","Maya"],["marcus","Marcus"],["sophie","Sophie"],["james","James"]];
const POSES = ["standing", "waving", "hands"];
const area=document.getElementById('area'), msg=document.getElementById('msg'),
      go=document.getElementById('go'), starEl=document.getElementById('stars');
let stars=0, missing=null, phase='idle';

function say(t){ try{const u=new SpeechSynthesisUtterance(t);u.rate=.85;u.pitch=1.15;speechSynthesis.speak(u);}catch(e){} }
function drawStars(){ starEl.textContent="\u2b50".repeat(stars); }
function pose(){ return POSES[Math.floor(Math.random()*POSES.length)]; }

function showAll(){
  area.innerHTML='<div class="stage" id="stage"></div>';
  const s=document.getElementById('stage');
  CHARS.forEach(([id,name])=>{
    const d=document.createElement('div');
    d.className='friend'; d.id='f_'+id;
    d.innerHTML='<img alt="'+name+'" src="'+SPRITES[id+'_'+pose()]+'"><b>'+name+'</b>';
    s.appendChild(d);
  });
}

function round(){
  phase='look'; go.style.display='none';
  msg.textContent='Look at all four friends...';
  showAll(); say('Look at all four friends');
  setTimeout(()=>{
    msg.textContent='Curtain up!';
    area.innerHTML='<div class="curtain">\ud83c\udfad</div>';
    setTimeout(()=>{
      missing = CHARS[Math.floor(Math.random()*CHARS.length)];
      showAll();
      document.getElementById('f_'+missing[0]).classList.add('gone');
      msg.textContent='Who is missing?';
      say('Who is missing?');
      askAnswers();
      phase='answer';
    },1100);
  },2600);
}

function askAnswers(){
  const wrap=document.createElement('div');
  wrap.className='answers';
  CHARS.forEach(([id,name])=>{
    const b=document.createElement('button');
    b.className='ans'; b.textContent=name;
    b.onclick=()=>guess(b,id,name);
    wrap.appendChild(b);
  });
  area.appendChild(wrap);
}

function guess(btn,id,name){
  if(phase!=='answer')return;
  if(id===missing[0]){
    phase='done'; btn.classList.add('right');
    stars=Math.min(8,stars+1); drawStars();
    msg.textContent=name+' was missing! You got it.';
    say(name+' was missing! You got it.');
    document.getElementById('f_'+id).classList.remove('gone');
    go.textContent='Play again'; go.style.display='inline-block';
  } else {
    btn.classList.add('wrong');
    msg.textContent='Not quite — look again.';
    say('Not quite. Look again.');
  }
}

go.onclick=round; drawStars(); showAll();
</script></body></html>
