<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5BA672">
<title>Shop | LittleSprout</title>
<meta name="description" content="LittleSprout merch -- a t-shirt, cap, and water bottle featuring Maya, Marcus, Sophie, and James.">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sprout:#5BA672; --sprout-dark:#3C7A52; --sprout-deep:#2C5C3D;
    --cream:#FBF6EC; --cream-deep:#F3EAD6; --paper-line:#E7DCC4;
    --sky:#BFE3FA; --sky-deep:#185FA5; --sun:#FFD24A; --sun-deep:#E1A400;
    --bark:#36402C; --bark-soft:#555D48; --loss:#C6453B;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Nunito',sans-serif; background:var(--cream); color:var(--bark); line-height:1.65; }
  h1,h2,h3 { font-family:'Fredoka',sans-serif; font-weight:600; }
  a { color:var(--sprout-dark); }
  .wrap { max-width:900px; margin:0 auto; padding:0 24px; }
  .wrap.narrow { max-width:640px; }

  .nav { position:sticky; top:0; z-index:50; background:rgba(251,246,236,.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--paper-line); }
  .nav-inner { display:flex; align-items:center; justify-content:space-between; height:70px; max-width:1120px; margin:0 auto; padding:0 24px; }
  .logo { display:flex; align-items:center; gap:10px; font-family:'Fredoka',sans-serif; font-weight:700; font-size:22px; color:var(--sprout-deep); text-decoration:none; }
  .logo-mark { width:34px; height:34px; }
  .nav-links a { font-weight:700; font-size:15px; color:var(--bark-soft); text-decoration:none; margin-left:24px; }
  .nav-links a:hover { color:var(--sprout-dark); }

  .head { text-align:center; padding:52px 0 26px; }
  .head .eyebrow { display:inline-block; background:var(--sky); color:var(--sky-deep); font-weight:800; font-size:13px; letter-spacing:1px; text-transform:uppercase; padding:7px 16px; border-radius:50px; margin-bottom:16px; }
  .head h1 { font-size:clamp(28px,5vw,40px); margin-bottom:10px; }
  .head p { color:var(--bark-soft); font-weight:600; }

  main.wrap { padding-bottom:60px; }

  .product-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-top:10px; }
  .product-card { background:#fff; border:1px solid var(--paper-line); border-radius:20px; padding:22px; box-shadow:0 4px 14px rgba(54,64,44,.06);
    display:flex; flex-direction:column; }
  .product-icon { font-size:44px; text-align:center; margin-bottom:8px; }
  .product-card h3 { font-size:18px; text-align:center; margin-bottom:6px; }
  .product-card p { color:var(--bark-soft); font-weight:600; font-size:13.5px; text-align:center; margin-bottom:14px; flex:1; }
  .product-price { text-align:center; font-family:'Fredoka',sans-serif; font-weight:700; font-size:22px; color:var(--sprout-deep); margin-bottom:14px; }

  .card { background:#fff; border:1px solid var(--paper-line); border-radius:20px; padding:28px; margin-bottom:22px; box-shadow:0 4px 14px rgba(54,64,44,.06); }
  .card h2 { font-size:20px; margin-bottom:10px; }
  .card p { margin-bottom:12px; color:var(--bark-soft); font-weight:600; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--sprout); color:#fff;
    border:none; padding:13px 22px; font-size:15.5px; font-weight:600; font-family:inherit; border-radius:30px; cursor:pointer;
    text-decoration:none; width:100%; transition:transform .12s, box-shadow .12s; box-shadow:0 3px 0 var(--sprout-dark); }
  .btn:hover { transform:translateY(-1px); box-shadow:0 4px 0 var(--sprout-dark); }
  .btn:disabled { opacity:.6; cursor:default; transform:none; }

  label { display:block; font-weight:700; font-size:14px; margin:14px 0 5px; }
  input, select { width:100%; padding:11px 13px; border-radius:10px; border:1.5px solid var(--paper-line);
    font-family:inherit; font-size:15px; background:var(--cream); }
  input:focus, select:focus { outline:2px solid var(--sky-deep); outline-offset:1px; border-color:var(--sky-deep); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .hint { font-size:13px; color:var(--bark-soft); font-weight:600; margin-top:4px; }

  .status-line { text-align:center; font-weight:700; color:var(--bark-soft); padding:24px 0; }
  .status-line.error { color:var(--loss); }
  .spinner { display:inline-block; width:18px; height:18px; border:3px solid var(--paper-line); border-top-color:var(--sprout);
    border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:middle; margin-right:8px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation:none; } }

  .confirm-icon { font-size:48px; text-align:center; margin-bottom:6px; }
  .confirm h2 { text-align:center; }
  .confirm p { text-align:center; }

  .callout { border-left:5px solid var(--sun); background:#FFF9E8; border-radius:10px; padding:14px 18px; margin:14px 0; font-size:14px; }

  .footer { background:var(--bark); color:#D9DDD0; padding:38px 0 26px; margin-top:20px; }
  .footer a { color:#A8AE9C; font-weight:600; font-size:14px; margin-right:18px; text-decoration:none; }
  .footer a:hover { color:var(--sun); }

  :focus-visible { outline:3px solid var(--sky-deep); outline-offset:3px; border-radius:6px; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <svg class="logo-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M20 36 C20 26 20 20 20 16" stroke="#3C7A52" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M20 22 C14 22 9 18 8 11 C16 11 20 15 20 22 Z" fill="#5BA672"/>
        <path d="M20 18 C26 17 31 12 31 6 C24 6 20 11 20 18 Z" fill="#7CC68E"/>
        <circle cx="20" cy="37" r="2.2" fill="#E1A400"/>
      </svg>
      LittleSprout
    </a>
    <div class="nav-links">
      <a href="index.html#library">Books</a>
      <a href="index.html#shelf">Badge shelf</a>
      <a href="privacy.html">Privacy</a>
    </div>
  </div>
</nav>

<header class="head">
  <div class="wrap">
    <span class="eyebrow">🛍️ Shop</span>
    <h1>LittleSprout merch</h1>
    <p>For the biggest fans of Maya, Marcus, Sophie, and James.</p>
  </div>
</header>

<main class="wrap narrow" id="app">
  <!-- filled in by the script below -->
</main>

<footer class="footer">
  <div class="wrap">
    <a href="index.html#library">Books</a>
    <a href="index.html#games">Games</a>
    <a href="privacy.html">Privacy</a>
  </div>
</footer>

<script>
  // TODO: swap in the real deployed backend URL once Render deployment is
  // live -- see LittleSprout-Rewards/README.md. Left as a placeholder
  // rather than guessed, since a wrong URL here would fail silently in a
  // confusing way (every fetch below handles a failed/unreachable API by
  // showing "not available yet" rather than a broken blank page).
  const API_BASE = 'https://littlesprout-rewards.onrender.com/api';

  const TOKEN_KEY = 'littlesprout_shop_token';
  const app = document.getElementById('app');

  const PRODUCT_ICONS = { tshirt: '👕', hat: '🧢', water_bottle: '🍶' };

  function el(html) {
    const div = document.createElement('div');
    div.innerHTML = html.trim();
    return div.firstElementChild;
  }

  function money(cents) {
    return '$' + (cents / 100).toFixed(2).replace(/\.00$/, '');
  }

  function showUnavailable() {
    app.innerHTML = '';
    app.appendChild(el(`
      <div class="card">
        <h2>Not quite ready yet</h2>
        <p>The Shop is being set up right now &mdash; check back soon!</p>
        <a class="btn" href="index.html">Back to the library</a>
      </div>
    `));
  }

  function showProducts(products, cancelled) {
    app.innerHTML = '';
    if (cancelled) {
      app.appendChild(el(`<div class="callout">Checkout was cancelled &mdash; no charge was made. You can try again whenever you're ready.</div>`));
    }
    const grid = el('<div class="product-grid"></div>');
    products.forEach(function (p) {
      const card = el(`
        <div class="product-card">
          <div class="product-icon" aria-hidden="true">${PRODUCT_ICONS[p.id] || '🎁'}</div>
          <h3>${p.name}</h3>
          <p>${p.description}</p>
          <div class="product-price">${money(p.price_cents)}</div>
          <button class="btn" type="button" data-product="${p.id}">Buy &#8594;</button>
        </div>
      `);
      card.querySelector('button').addEventListener('click', function () { startCheckout(p.id); });
      grid.appendChild(card);
    });
    app.appendChild(grid);
    app.appendChild(el(`<p class="hint" style="text-align:center;margin-top:18px;">Prices include shipping. See our <a href="privacy.html#stickers">privacy page</a> for what's collected when you order.</p>`));
  }

  function showWaiting() {
    app.innerHTML = '';
    app.appendChild(el(`
      <div class="status-line"><span class="spinner" aria-hidden="true"></span>Confirming your payment&hellip;</div>
    `));
  }

  function showWaitingTimedOut(retry) {
    app.innerHTML = '';
    app.appendChild(el(`
      <div class="card">
        <p class="status-line error">This is taking longer than expected.</p>
        <p>Stripe's confirmation hasn't reached us yet &mdash; this sometimes takes a minute. You can try checking again, or come back to this page in a bit (your progress is saved).</p>
        <button class="btn" id="retryBtn" type="button">Check again</button>
      </div>
    `));
    document.getElementById('retryBtn').addEventListener('click', retry);
  }

  function showAddressForm(token, productName, variants, onSubmit) {
    app.innerHTML = '';
    const variantField = variants && variants.length
      ? `<label for="variant">Size</label>
         <select id="variant" name="variant" required>
           ${variants.map(function (v) { return '<option value="' + v + '">' + v + '</option>'; }).join('')}
         </select>`
      : '';
    const form = el(`
      <form class="card" id="addressForm">
        <h2>Where should we send your ${productName}?</h2>
        <label for="recipientName">Your name</label>
        <input id="recipientName" name="recipientName" type="text" required autocomplete="name">
        ${variantField}
        <label for="addressLine1">Address</label>
        <input id="addressLine1" name="addressLine1" type="text" required autocomplete="address-line1">
        <input id="addressLine2" name="addressLine2" type="text" placeholder="Apt, suite, etc. (optional)" autocomplete="address-line2" style="margin-top:8px">

        <div class="row2">
          <div><label for="city">City</label><input id="city" name="city" type="text" required autocomplete="address-level2"></div>
          <div><label for="state">State</label><input id="state" name="state" type="text" required autocomplete="address-level1"></div>
        </div>
        <div class="row2">
          <div><label for="postalCode">ZIP code</label><input id="postalCode" name="postalCode" type="text" required autocomplete="postal-code"></div>
          <div><label for="country">Country</label><input id="country" name="country" type="text" value="US" maxlength="2" required autocomplete="country"></div>
        </div>

        <button class="btn" type="submit" style="margin-top:16px">Send my order &#8594;</button>
        <p class="status-line error" id="formError" hidden></p>
      </form>
    `);
    app.appendChild(form);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      onSubmit({
        token: token,
        recipient_name: form.recipientName.value,
        variant: form.variant ? form.variant.value : null,
        address_line1: form.addressLine1.value,
        address_line2: form.addressLine2.value || null,
        city: form.city.value,
        state: form.state.value,
        postal_code: form.postalCode.value,
        country: form.country.value.toUpperCase(),
      });
    });
  }

  function showConfirmation() {
    app.innerHTML = '';
    app.appendChild(el(`
      <div class="card confirm">
        <div class="confirm-icon" aria-hidden="true">📬</div>
        <h2>On its way!</h2>
        <p>Thanks for supporting LittleSprout. Your order will arrive by mail soon.</p>
        <a class="btn" href="index.html">Back to the library</a>
      </div>
    `));
  }

  function showAlreadyUsed() {
    app.innerHTML = '';
    app.appendChild(el(`
      <div class="card">
        <h2>Already sent</h2>
        <p>This order has already been used to request a shipment &mdash; one per order, so a second request can't be submitted with the same link.</p>
        <a class="btn" href="index.html">Back to the library</a>
      </div>
    `));
  }

  async function apiFetch(path, options) {
    const res = await fetch(API_BASE + path, options);
    return res;
  }

  async function loadProducts(cancelled) {
    try {
      const res = await apiFetch('/products');
      if (!res.ok) { showUnavailable(); return; }
      const products = await res.json();
      showProducts(products, cancelled);
    } catch (e) {
      showUnavailable();
    }
  }

  async function startCheckout(productId) {
    try {
      const res = await apiFetch('/checkout/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ product_id: productId }),
      });
      if (!res.ok) { showUnavailable(); return; }
      const data = await res.json();
      sessionStorage.setItem(TOKEN_KEY, data.token);
      window.location.href = data.checkout_url;
    } catch (e) {
      showUnavailable();
    }
  }

  async function pollStatus(token, attemptsLeft) {
    if (attemptsLeft <= 0) {
      showWaitingTimedOut(function () { pollStatus(token, 10); });
      return;
    }
    try {
      const res = await apiFetch('/checkout/status?token=' + encodeURIComponent(token));
      if (res.status === 404) { loadProducts(false); return; }
      if (!res.ok) { showUnavailable(); return; }
      const data = await res.json();
      if (data.consumed) { showAlreadyUsed(); return; }
      if (data.paid) {
        showAddressForm(token, data.product_name || 'order', data.variants, submitRequest);
        return;
      }
      setTimeout(function () { pollStatus(token, attemptsLeft - 1); }, 1500);
    } catch (e) {
      showUnavailable();
    }
  }

  async function submitRequest(payload) {
    const errorEl = document.getElementById('formError');
    const submitBtn = document.querySelector('#addressForm button[type=submit]');
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Sending…'; }
    try {
      const res = await apiFetch('/requests', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (res.status === 201) {
        sessionStorage.removeItem(TOKEN_KEY);
        showConfirmation();
        return;
      }
      if (res.status === 409) { showAlreadyUsed(); return; }
      if (errorEl) {
        errorEl.hidden = false;
        errorEl.textContent = 'Something went wrong sending that — please try again.';
      }
    } catch (e) {
      if (errorEl) {
        errorEl.hidden = false;
        errorEl.textContent = 'Something went wrong sending that — please try again.';
      }
    } finally {
      if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Send my order →'; }
    }
  }

  (function init() {
    const params = new URLSearchParams(window.location.search);
    const urlToken = params.get('token');
    const storedToken = sessionStorage.getItem(TOKEN_KEY);
    const token = urlToken || storedToken;
    const cancelled = params.get('cancelled') === '1';

    if (cancelled) {
      sessionStorage.removeItem(TOKEN_KEY);
      loadProducts(true);
      return;
    }

    if (token) {
      if (urlToken) sessionStorage.setItem(TOKEN_KEY, urlToken);
      showWaiting();
      pollStatus(token, 10);
    } else {
      loadProducts(false);
    }
  })();
</script>
</body>
</html>
